<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="../"><img class="logo" src="../assets/img/logo.png" alt="Abid Hasan"></a>
    <button class="menu-btn" aria-expanded="false" aria-label="Menu">Menu</button>
    <nav>
      <ul>
        <li><a href="../">Home</a></li>
        <li><a href="../portfolio/">Portfolio</a></li>
        <li><a href="../contact/" aria-current="page">Contact</a></li>
        <li><a class="navcta" href="../contact/">Contact me</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="contact-hero">
    <div class="wrap contact-container">
      
      <!-- Typing Headline -->
      <h1 class="contact-headline">
        Say <bdi id="typed" class="typed" data-words="hello|hola|bonjour|ciao|hallo|こんにちは|你好|안녕하세요|مرحبا|olá"><noscript>hello</noscript></bdi>
      </h1>

      <!-- One-line turnaround info -->
      <p class="contact-reply">
        <span class="status-dot" aria-hidden="true"></span>
        Replies within 24 hours.
      </p>

      <!-- Main Action Button -->
      <div class="contact-action">
        <a class="contactButton" href="mailto:inbox.dathasan@gmail.com?subject=Project%20Enquiry">
          Email me
          <span class="iconButton" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C2561B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </span>
        </a>
      </div>

      <!-- Social Links -->
      <div class="contact-social">
        <a href="http://instagram.com/datasandraws" target="_blank" rel="noopener">Instagram</a>
        <span class="sep">/</span>
        <a href="https://www.behance.net/dathasan" target="_blank" rel="noopener">Behance</a>
        <span class="sep">/</span>
        <a href="http://linkedin.com/in/abidhasan101/" target="_blank" rel="noopener">LinkedIn</a>
      </div>

    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="social">
      <a href="mailto:inbox.dathasan@gmail.com">Email</a>
      <a href="http://instagram.com/datasandraws" target="_blank" rel="noopener">Instagram</a>

      <a href="http://linkedin.com/in/abidhasan101/" target="_blank" rel="noopener">LinkedIn</a>
    </span>
    <span>© 2026 Abid Hasan. All rights reserved.</span>
  </div>
</footer>

<script src="../assets/js/main.js"></script>
